name: Run tests

on:
  push:
    branches:
      - main
      - master
      - develop
      - f25
  pull_request:
    branches:
      - main
      - master
      - develop
      - f25

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Install ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      
      - name: Run ollama
        run: |
          ollama serve &
          ollama pull mistral:7b

      - name: Run tests
        run: uv run pytest
